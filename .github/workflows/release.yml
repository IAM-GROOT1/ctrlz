name: release

# Runs only when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# A tag whose version contains a hyphen (for example v1.3.0-beta.1) is published as a
# GitHub pre-release, which is what the updater's pre-release channel looks for.
on:
  push:
    tags:
      - "v*"

# Least privilege: read by default; only the release job may write.
permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      # The tag is the single source of truth for the version. build/version.ps1 strips
      # the leading v and refuses anything that is not MAJOR.MINOR.PATCH[-pre.release].
      - name: Resolve version from the tag
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = & ./build/version.ps1
          $prerelease = $version.Contains('-')
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "prerelease=$($prerelease.ToString().ToLowerInvariant())"
          Write-Host "Version: $version (pre-release: $prerelease)"

      - name: Restore
        run: dotnet restore CTRL+Z.sln

      # Builds EVERY project in CTRL+Z.sln (CtrlZ.Core, CtrlZ.App, CtrlZ.Core.Tests), so the
      # app is compiled too. `dotnet test` alone does not build CtrlZ.App, because the test
      # project does not reference it; that gap is exactly what the next step guards.
      - name: Build the whole solution (Release)
        run: dotnet build CTRL+Z.sln -c Release --no-restore --nologo

      - name: Verify the whole solution was built
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = @(
            "src/CtrlZ.Core/bin/Release/net8.0-windows/CtrlZ.Core.dll",
            "src/CtrlZ.App/bin/Release/net8.0-windows/CTRL+Z.dll",
            "tests/CtrlZ.Core.Tests/bin/Release/net8.0-windows/CtrlZ.Core.Tests.dll"
          )
          $missing = @($expected | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            throw "Build output is missing for: $($missing -join ', ')"
          }
          Write-Host "All solution projects were built:"
          $expected | ForEach-Object { Write-Host "  $_" }

      - name: Test
        run: dotnet test CTRL+Z.sln -c Release --no-build --nologo

      # Pinned and hash-verified: see build/install-inno-setup.ps1. Never use an unpinned
      # `choco install innosetup` here, or releases stop being reproducible.
      - name: Install Inno Setup (pinned, hash-verified)
        shell: pwsh
        run: ./build/install-inno-setup.ps1

      # --- Code signing (future roadmap step) ------------------------------------
      # Signing is deliberately NOT implemented yet. When it is, add a signing step
      # here, after the binaries are built and BEFORE the checksums are generated, so
      # SHA256SUMS.txt covers the signed bytes:
      #
      #   - name: Sign binaries
      #     if: ${{ env.SIGNING_CERTIFICATE != '' }}
      #     shell: pwsh
      #     run: ./build/sign.ps1 -Version "${{ steps.version.outputs.version }}"
      #
      # It will need a code-signing certificate kept in repository secrets and a new
      # release-workflow permission to read it. No signing secrets exist today.
      # ---------------------------------------------------------------------------

      - name: Build the installer and the portable exe
        shell: pwsh
        run: ./build/build-installer.ps1 -Version "${{ steps.version.outputs.version }}" -SkipTests

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assets = @()
          foreach ($pattern in @("./artifacts/installer/CTRL+Z-Setup-*.exe", "./artifacts/CTRL+Z-Portable-*.exe", "./artifacts/ctrlz-*.exe")) {
            $found = @(Get-ChildItem $pattern -ErrorAction SilentlyContinue)
            if ($found.Count -ne 1) {
              throw "Expected exactly one asset matching $pattern; found $($found.Count)."
            }
            $assets += $found
          }

          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Path $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "{0}  {1}" -f $hash, $asset.Name
          }

          $sumsPath = "./artifacts/SHA256SUMS.txt"
          Set-Content -Path $sumsPath -Value $lines -Encoding utf8

          # Never publish a release without checksums: the updater refuses to install an
          # asset it cannot verify, so a missing file would break every future update.
          if (-not (Test-Path $sumsPath)) { throw "SHA256SUMS.txt was not generated." }
          $content = @(Get-Content $sumsPath)
          if ($content.Count -eq 0) { throw "SHA256SUMS.txt is empty." }
          foreach ($asset in $assets) {
            if (-not ($content -match [regex]::Escape($asset.Name))) {
              throw "SHA256SUMS.txt does not list $($asset.Name)."
            }
          }

          Write-Host "SHA256SUMS.txt:"
          $content | ForEach-Object { Write-Host "  $_" }

      - name: Stage release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = "./artifacts/release"
          New-Item -ItemType Directory -Force $releaseDir | Out-Null
          Copy-Item ./artifacts/installer/CTRL+Z-Setup-*.exe $releaseDir
          Copy-Item ./artifacts/CTRL+Z-Portable-*.exe $releaseDir
          Copy-Item ./artifacts/ctrlz-*.exe $releaseDir
          Copy-Item ./artifacts/SHA256SUMS.txt $releaseDir

          if (-not (Test-Path (Join-Path $releaseDir "SHA256SUMS.txt"))) {
            throw "SHA256SUMS.txt is missing from the staged release assets."
          }
          Get-ChildItem $releaseDir | Select-Object Name, Length

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: artifacts/release

      - name: Confirm SHA256SUMS.txt is present before publishing
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sums = "./artifacts/release/SHA256SUMS.txt"
          if (-not (Test-Path $sums)) {
            throw "Refusing to publish: SHA256SUMS.txt is missing from the downloaded assets."
          }
          $content = @(Get-Content $sums | Where-Object { $_.Trim() })
          if ($content.Count -eq 0) {
            throw "Refusing to publish: SHA256SUMS.txt is empty."
          }
          Write-Host "SHA256SUMS.txt has $($content.Count) entries."
          Get-ChildItem ./artifacts/release | Select-Object Name, Length

      - name: Generate release notes from commits
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $previous = git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($previous)) {
            $range = $tag
            $heading = "All changes"
          }
          else {
            $range = "$previous..$tag"
            $heading = "Changes since $previous"
          }

          # Join into a single string: a bare array element would be stringified as
          # "System.Object[]" when the notes body is joined.
          $commits = (git log --pretty=format:"- %s (%h)" $range) -join "`n"
          if ([string]::IsNullOrWhiteSpace($commits)) {
            $commits = "_No commits between the previous tag and this one._"
          }

          $version = $tag.TrimStart('v')
          $setupName = "CTRL+Z-Setup-$version.exe"
          $portableName = "CTRL+Z-Portable-$version.exe"
          $body = @(
            "# CTRL+Z $tag",
            "",
            "## $heading",
            "",
            $commits,
            "",
            "## Downloads",
            "",
            "- $setupName - installer for installed copies",
            "- $portableName - standalone portable exe",
            "- SHA256SUMS.txt - SHA-256 for every asset above; the updater refuses an asset that does not match"
          ) -join "`n"

          Set-Content -Path release-notes.md -Value $body -Encoding utf8
          Get-Content release-notes.md

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')

          $arguments = @(
            "release", "create", $tag,
            "--verify-tag",
            "--title", "CTRL+Z $version",
            "--notes-file", "release-notes.md"
          )

          # A hyphen in the version marks a pre-release, so the updater's stable
          # channel skips it and its pre-release channel offers it.
          if ($version.Contains('-')) {
            $arguments += "--prerelease"
          }

          $assets = Get-ChildItem ./artifacts/release/* | ForEach-Object { $_.FullName }
          $arguments += $assets

          Write-Host "gh $($arguments -join ' ')"
          gh @arguments

      # Verifies the upload actually happened, not just that the file existed locally.
      - name: Confirm the published release contains SHA256SUMS.txt
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          $release = gh release view $tag --json assets | ConvertFrom-Json
          $names = @($release.assets.name)

          Write-Host "Published assets: $($names -join ', ')"
          if ($names -notcontains "SHA256SUMS.txt") {
            throw "The published release for $tag is missing SHA256SUMS.txt."
          }

      # Must run last: the release exists and its assets are verified, so the site can safely read
      # the new version. Deliberately non-blocking - a website rebuild is never a reason to mark a
      # good release as failed. See docs/website-hook.md.
      - name: Ask the website to rebuild (Cloudflare Pages)
        shell: bash
        continue-on-error: true
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          set -u

          if [ -z "${DEPLOY_HOOK:-}" ]; then
            echo "::notice::CLOUDFLARE_PAGES_DEPLOY_HOOK is not set in this repository; skipping the website rebuild."
            exit 0
          fi

          for attempt in 1 2 3; do
            # --silent keeps the hook URL out of the log.
            if curl --fail --silent --show-error --max-time 20 -X POST "$DEPLOY_HOOK"; then
              echo "::notice::Website rebuild triggered (attempt $attempt)."
              exit 0
            fi
            echo "Hook call failed on attempt $attempt; retrying in 5s."
            sleep 5
          done

          echo "::warning::The website rebuild hook could not be reached after 3 attempts. The release itself is unaffected."
          exit 0
