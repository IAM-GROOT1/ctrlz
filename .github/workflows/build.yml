name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test --configuration Release --nologo

      - name: Publish portable
        run: .\build\publish.ps1 -Version 1.1.1 -SkipTests

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: CTRL+Z-portable
          path: artifacts/CTRL+Z-Portable-*.exe
          if-no-files-found: error
