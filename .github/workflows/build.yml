name: build

# Pull-request CI: builds the solution and runs the full test suite on every PR, and
# publishes a portable artifact from main. Releases are produced by release.yml, which
# runs only on a version tag.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roadmap-sync:
    name: README roadmap block is in sync
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The README "What's coming" block is generated from ROADMAP.md. Editing a status line
      # without re-running the script would leave the two disagreeing, so fail here instead.
      - name: Verify the README block matches ROADMAP.md
        shell: pwsh
        run: "& ./build/sync-readme-roadmap.ps1 -Check"

  test-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # build/version.ps1 falls back to `git describe --tags`, so the tags must be
          # present even on a pull-request checkout.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CTRL+Z.sln

      # Builds EVERY project in CTRL+Z.sln (CtrlZ.Core, CtrlZ.App, CtrlZ.Core.Tests).
      # `dotnet test` alone would not build CtrlZ.App, because the test project does not
      # reference it, so this step is what guarantees the app compiles.
      - name: Build the whole solution
        run: dotnet build CTRL+Z.sln -c Release --no-restore --nologo

      - name: Verify the whole solution was built
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = @(
            "src/CtrlZ.Core/bin/Release/net8.0-windows/CtrlZ.Core.dll",
            "src/CtrlZ.App/bin/Release/net8.0-windows/CTRL+Z.dll",
            "tests/CtrlZ.Core.Tests/bin/Release/net8.0-windows/CtrlZ.Core.Tests.dll"
          )
          $missing = @($expected | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            throw "Build output is missing for: $($missing -join ', ')"
          }
          Write-Host "All solution projects were built."

      - name: Test
        run: dotnet test CTRL+Z.sln -c Release --no-build --nologo

      # Same pinned, hash-verified compiler as the release workflow, so a broken installer
      # script (including the uninstaller's [Code]) fails here, not when a version is tagged.
      - name: Install Inno Setup (pinned, hash-verified)
        shell: pwsh
        run: ./build/install-inno-setup.ps1

      # Version comes from the newest git tag via build/version.ps1, so CI output is
      # never labelled with a hard-coded number. This publishes the portable exe and the
      # command line, then compiles the installer from them.
      - name: Publish portable and build the installer
        shell: pwsh
        run: ./build/build-installer.ps1 -SkipTests

      - name: Upload portable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CTRL+Z-portable
          path: artifacts/CTRL+Z-Portable-*.exe
          if-no-files-found: error

      # Kept for a few days so a pull request's installer can be tested in a VM before a release.
      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CTRL+Z-installer
          path: artifacts/installer/CTRL+Z-Setup-*.exe
          if-no-files-found: error
          retention-days: 7
